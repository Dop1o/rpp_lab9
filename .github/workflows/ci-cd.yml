name: Django CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Тестирование и проверка кода
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получение кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Статический анализ кода (Pylint)
        continue-on-error: true
        run: |
          echo "Запуск Pylint..."
          pylint --load-plugins=pylint_django \
                 --django-settings-module=lab8.settings \
                 transactions/ || echo "Pylint завершен (ошибки не критичны)"

      - name: Запуск тестов Django
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          python manage.py migrate
          python manage.py test transactions -v 2

  deploy-staging:
    name: Деплой на Render Staging
    needs: test-and-lint
    if: github.ref == 'refs/heads/staging' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на Render Staging
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"

  deploy-production:
    name: Деплой на Render Production
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на Render Production
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"
