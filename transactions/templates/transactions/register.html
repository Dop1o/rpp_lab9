<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; margin: 0; }
        header { background: #1f2d3d; color: white; padding: 18px; text-align: center; }
        .container { max-width: 400px; margin: 60px auto; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>Финансовые переводы - Lab8</header>
    <div class="container">
        <div class="card">
            <h2>Регистрация</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <label>Логин:</label>
                <input type="text" name="username" required autofocus>
                
                <label>Пароль:</label>
                <input type="password" name="password1" required>
                
                <label>Подтверждение пароля:</label>
                <input type="password" name="password2" required>
                
                <button type="submit">Зарегистрироваться</button>
            </form>
            
            <p style="text-align:center; margin-top:20px;">
                <a href="/login/">Уже есть аккаунт? Войти</a>
            </p>
        </div>
    </div>
</body>
</html>
