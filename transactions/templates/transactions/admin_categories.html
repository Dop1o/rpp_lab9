<!DOCTYPE html>
<html>
<head>
    <title>Управление категориями</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; margin: 0; padding-bottom: 50px; }
        header { background: #1f2d3d; color: white; padding: 18px; text-align: center; font-size: 22px; }
        .container { max-width: 800px; margin: 40px auto; }
        .card { background: white; padding: 25px; border-radius: 12px;}
        h2 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; display: inline-block;}
        .btn-add { background: #27ae60; color: white; }
        .btn-delete { background: #c0392b; color: white; padding: 5px 10px; font-size: 14px; }
        .btn-back { background: #7f8c8d; color: white; }
        .message { background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>💰 Управление категориями</header>
    <div class="container">
        <div class="card">
            <h2>Категории</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <a href="/categories/create/" class="btn btn-add">Добавить категорию</a>
            <a href="/" class="btn btn-back" style="margin-left:10px;">На главную</a>
            
            <table style="margin-top:20px;">
                <thead>
                    <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
                </thead>
                <tbody>
                    {% for cat in categories %}
                    <tr>
                        <td>{{ cat.id }}</td>
                        <td>{{ cat.name }}</td>
                        <td>
                            <a href="/categories/delete/{{ cat.id }}/" class="btn-delete" style="text-decoration:none;" onclick="return confirm('Удалить категорию?')">Удалить</a>
                        </td>
                    </tr>
                    {% empty %}
                        <tr><td colspan="3" style="text-align:center;">Нет категорий</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
